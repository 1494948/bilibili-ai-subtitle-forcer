<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>B站AI字幕强制开启器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<header class="hd">
  <img class="hd-logo" src="../icons/icon32.png" alt="">
  <div class="hd-text">
    <div class="hd-title">B站 AI 字幕强制开启器</div>
    <div class="hd-sub" id="hdSub">v1.0.0</div>
  </div>
  <label class="switch" title="总开关">
    <input type="checkbox" id="enabled">
    <span class="slider"></span>
  </label>
</header>

<section class="card status-card">
  <div class="status-row">
    <span class="dot" id="statusDot"></span>
    <span class="status-text" id="statusText">正在读取当前页面…</span>
  </div>
  <div class="status-meta" id="statusMeta"></div>
  <div class="btn-row">
    <button type="button" class="btn btn-primary" id="btnForce">强制开启字幕</button>
    <button type="button" class="btn" id="btnOverlay">切换渲染层</button>
  </div>
</section>

<details class="card" open>
  <summary>注入方式</summary>
  <div class="card-body">
    <label class="field switch-field">
      <span>强制注入字幕数据<em>把免登录通道的字幕并进播放器接口响应</em></span>
      <span class="switch sm"><input type="checkbox" id="forceInject"><span class="slider"></span></span>
    </label>
    <label class="field switch-field">
      <span>自动打开 AI 字幕<em>注入成功后自己把字幕语言点开</em></span>
      <span class="switch sm"><input type="checkbox" id="autoOpen"><span class="slider"></span></span>
    </label>
    <div class="field">
      <span>渲染方式</span>
      <div class="seg" id="injectInto">
        <label><input type="radio" name="injectInto" value="player"><span>用 B 站原生</span></label>
        <label><input type="radio" name="injectInto" value="both"><span>原生 + 自建层</span></label>
        <label><input type="radio" name="injectInto" value="overlay"><span>只用自建层</span></label>
      </div>
      <p class="hint">自建层才能做双语与样式自定义；开启后会自动隐藏 B 站原生字幕避免重叠。</p>
    </div>
  </div>
</details>

<details class="card">
  <summary>双语与语言</summary>
  <div class="card-body">
    <label class="field switch-field">
      <span>双语对照<em>同时加载两条轨，上下两行显示</em></span>
      <span class="switch sm"><input type="checkbox" id="bilingual"><span class="slider"></span></span>
    </label>
    <div class="field two-col">
      <label>
        <span>主语言</span>
        <select id="primaryLang">
          <option value="zh">中文（优先 AI 中文）</option>
          <option value="en">英文</option>
          <option value="ja">日文</option>
          <option value="ko">韩文</option>
          <option value="ai-zh">仅 AI 中文</option>
          <option value="ai-en">仅 AI 英文</option>
        </select>
      </label>
      <label>
        <span>副语言</span>
        <select id="secondaryLang">
          <option value="en">英文</option>
          <option value="zh">中文</option>
          <option value="ja">日文</option>
          <option value="ko">韩文</option>
        </select>
      </label>
    </div>
  </div>
</details>

<details class="card">
  <summary>字幕样式</summary>
  <div class="card-body">
    <div class="field two-col">
      <label>
        <span>字号 <b id="vFontSize">26</b> px</span>
        <input type="range" id="fontSize" min="10" max="72" step="1">
      </label>
      <label>
        <span>距底 <b id="vBottom">8</b> %</span>
        <input type="range" id="bottom" min="0" max="60" step="1">
      </label>
    </div>
    <div class="field two-col">
      <label>
        <span>描边 <b id="vStrokeWidth">2</b> px</span>
        <input type="range" id="strokeWidth" min="0" max="8" step="0.5">
      </label>
      <label>
        <span>底衬 <b id="vBgOpacity">45</b> %</span>
        <input type="range" id="bgOpacity" min="0" max="100" step="5">
      </label>
    </div>
    <div class="field two-col">
      <label>
        <span>文字颜色</span>
        <input type="color" id="color">
      </label>
      <label>
        <span>描边颜色</span>
        <input type="color" id="strokeColor">
      </label>
    </div>
    <div class="field">
      <span>最大宽度 <b id="vMaxWidth">84</b> %</span>
      <input type="range" id="maxWidth" min="20" max="100" step="2">
    </div>
  </div>
</details>

<details class="card">
  <summary>ASR 兜底（无 AI 字幕时）</summary>
  <div class="card-body">
    <p class="hint warn">
      只有当这个视频服务端确实没有 AI 字幕时才需要。识别在本机抓音频、分片发往你自己配置的接口，
      需要保持视频播放。请填写 OpenAI 兼容的 <code>/v1/audio/transcriptions</code> 地址。
    </p>
    <label class="field switch-field">
      <span>启用 ASR 兜底<em>不自动开跑，由你点浮标决定</em></span>
      <span class="switch sm"><input type="checkbox" id="asrEnabled"><span class="slider"></span></span>
    </label>
    <div class="field">
      <span>接口地址</span>
      <input type="text" id="asrEndpoint" placeholder="https://api.example.com/v1/audio/transcriptions">
    </div>
    <div class="field">
      <span>API Key</span>
      <input type="password" id="asrApiKey" placeholder="sk-...（仅存本机）">
    </div>
    <div class="field two-col">
      <label>
        <span>模型</span>
        <input type="text" id="asrModel" placeholder="whisper-1">
      </label>
      <label>
        <span>语言</span>
        <input type="text" id="asrLanguage" placeholder="zh">
      </label>
    </div>
    <div class="field">
      <span>分片长度 <b id="vChunk">20</b> 秒</span>
      <input type="range" id="asrChunkSeconds" min="5" max="60" step="1">
    </div>
    <div class="btn-row">
      <button type="button" class="btn" id="btnGrant">授权该接口域名</button>
      <button type="button" class="btn" id="btnAsr">开始识别</button>
      <button type="button" class="btn" id="btnAsrStop">停止</button>
    </div>
  </div>
</details>

<footer class="ft">
  <label class="mini"><input type="checkbox" id="debug"> 调试日志</label>
  <span class="ft-right" id="ftStats"></span>
</footer>

<script src="../lib/settings.js"></script>
<script src="popup.js"></script>
</body>
</html>
